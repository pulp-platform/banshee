---
address:
  scratch_reg: 0x00040000
  wakeup_reg: 0x00040004
  tcdm_start: 0x00040008
  tcdm_end: 0x00040000
  nr_cores: 0x00040014
  uart: 0x00052000
  # Not supported in MemPool
  barrier_reg:
    start: 0x50000000
    offset: 0x100000
  cluster_base_hartid: 0x50000001
  cluster_num: 0x50000002
  cluster_id: 0x50000003
  cl_clint: 0x40000060
  clint: 0xFFFF0000
memory:
  tcdm:
    start: 0x0
    size: 0x00040000
    offset: 0x0
    latency: 5
  dram:
    start: 0x00080000
    size:  0x00080000
    offset: 0x0
    latency: 10
  periphs:
    start: 0x00051000
    size:  0x00003000
    offset: 0x0
    latency: 5
    callbacks:
      - name: zero-memory
        size: 0x10000
      - name: mempool-dma
        size: 0x1C
inst_latency:
  mul: 3
  mulh: 3
  mulhsu: 3
  mulhu: 3
  div: 3
  divu: 3
  rem: 3
  remu: 3
ssr:
  num_dm: 3
